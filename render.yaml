# Render blueprint for the API. The frontend is deployed separately on Vercel.
services:
  - type: web
    name: resqgrid-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: AUTOSEED
        value: "1"
      - key: DEMO_OTP
        value: "1"
      - key: RESQ_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
